name: Sync Fork

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Sync
        run: |
          git remote add upstream https://github.com/OSGeo/PROJ.git
          git fetch upstream
          git checkout master
          git merge upstream/master
          git push origin master
