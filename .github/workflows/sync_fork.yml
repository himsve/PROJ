name: Sync Fork

on:
  schedule:
     - cron: '*/5 * * * *'
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
  
    steps:
      - name: Sync fork
        uses: tgymnich/fork-sync@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_repository: OSGeo/PROJ
          target_branch: master

